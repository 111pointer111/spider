name: Release
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm test
      - name: Verify versions and user-facing release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME"
      - run: npm run build
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            styles.css
            manifest.json
          body_path: .github/release-notes/${{ github.ref_name }}.md
